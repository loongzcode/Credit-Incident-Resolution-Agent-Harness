server {
    listen 80;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    # Do not log request URL, query string, auth headers, or raw identifiers.
    access_log off;
    error_log /dev/stderr crit;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /ui/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
    }
    location /health/ { return 404; }
    location /metrics { return 404; }
    location /admin-api/ {
        client_max_body_size 6m;
        proxy_pass http://registry-admin:8002/admin/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
    }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
