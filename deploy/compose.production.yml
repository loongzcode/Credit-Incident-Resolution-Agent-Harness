# Supply secrets through a deployment secret manager; no default production credentials.
x-worker: &worker
  image: credit-harness-worker:${RELEASE_SHA:?required}
  restart: unless-stopped
  stop_grace_period: 135s
  read_only: true
  tmpfs: [/tmp]
services:
  registry-admin:
    image: credit-harness-api:${RELEASE_SHA:?required}
    env_file: ${ADMIN_ENV_FILE:?required}
    command: [python, -m, scripts.serve_registry_admin, --host, 0.0.0.0, --port, '8002']
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 45s
  api:
    image: credit-harness-api:${RELEASE_SHA:?required}
    env_file: ${API_ENV_FILE:?required}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 3
  agent:
    <<: *worker
    env_file: ${AGENT_ENV_FILE:?required}
    volumes:
      - ${TOOL_BINDINGS_FILE_HOST:?required}:/run/secrets/tool-bindings.json:ro
    environment:
      TOOL_BINDINGS_FILE: /run/secrets/tool-bindings.json
    command: [python, -m, credit_harness.production.workers, agent]
  orchestration:
    <<: *worker
    env_file: ${ORCHESTRATION_ENV_FILE:?required}
    volumes:
      - ${TOOL_BINDINGS_FILE_HOST:?required}:/run/secrets/tool-bindings.json:ro
    environment:
      TOOL_BINDINGS_FILE: /run/secrets/tool-bindings.json
    command: [python, -m, credit_harness.production.workers, orchestration]
  recovery:
    <<: *worker
    env_file: ${RECOVERY_ENV_FILE:?required}
    command: [python, -m, credit_harness.production.workers, recovery]
  embedding:
    <<: *worker
    env_file: ${EMBEDDING_ENV_FILE:?required}
    command: [python, -m, credit_harness.production.workers, embedding]
  frontend:
    image: credit-harness-frontend:${RELEASE_SHA:?required}
    ports: ["443:443", "80:80"]
    volumes:
      - ${TLS_CERT_FILE:?required}:/run/secrets/tls.crt:ro
      - ${TLS_KEY_FILE:?required}:/run/secrets/tls.key:ro
    depends_on: [api, registry-admin]
