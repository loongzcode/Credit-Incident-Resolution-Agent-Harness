[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-incident-harness"
version = "0.1.0"
description = "Evidence-bounded financial simulator for credit incident investigation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
credit-sim = "credit_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["postgres: requires TEST_POSTGRES_URL pointing to a dedicated test database"]

