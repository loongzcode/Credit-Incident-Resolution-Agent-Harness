[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-incident-harness"
version = "0.1.0"
description = "Evidence-bounded financial simulator for credit incident investigation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.13,<3",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7,<1",
    "python-multipart>=0.0.22,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
test-parallel = ["pytest>=8,<10", "pytest-xdist>=3,<4"]
llm = ["openai>=3.11,<4"]

[project.scripts]
credit-sim = "credit_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "postgres: requires TEST_POSTGRES_URL pointing to a dedicated test database",
    "llm: optional live provider test; RUN_LLM_TESTS=1, OPENAI_API_KEY and PLANNER_MODEL required",
]
